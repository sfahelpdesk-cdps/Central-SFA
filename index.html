<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#bb000f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Central SFA" />
  <title>Central SFA</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans:    ['Inter', 'sans-serif'],
            display: ['IBM Plex Sans', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overscroll-behavior-y: none; }
    body { font-family: 'Inter', sans-serif; background: #f8f8f8; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    /* Page transition */
    #app { animation: fadeIn .18s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* Loader */
    #global-loader { backdrop-filter: blur(2px); }
    .loader-ring {
      width: 36px; height: 36px;
      border: 3px solid rgba(187,0,15,.15);
      border-top-color: #bb000f;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Safe area padding for iOS notch */
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>

<body class="bg-gray-50">

  <!-- Global Loader -->
  <div id="global-loader" class="hidden fixed inset-0 bg-white/70 z-[9999] flex items-center justify-center">
    <div class="bg-white rounded-2xl p-6 shadow-xl flex flex-col items-center gap-3">
      <div class="loader-ring"></div>
      <p class="text-xs text-gray-500 font-medium">Memuat data...</p>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-28 left-1/2 -translate-x-1/2 z-[999] px-5 py-3 rounded-full text-white text-sm font-medium shadow-lg transition-opacity duration-300 bg-gray-900 pointer-events-none" style="opacity:0">
    Pesan notifikasi
  </div>

  <!-- App Shell -->
  <div id="app" class="min-h-screen"></div>

  <!-- Scripts -->
<script src="app.js"></script>
  <script>
    // Page registry (must be defined BEFORE pages.js)
    const Pages = {};
  </script>
<script src="pages.js"></script>

  <script>
    // Register routes
    SFA.Router.register('login',     Pages.login);
    SFA.Router.register('dashboard', Pages.dashboard);
    SFA.Router.register('routes',    Pages.routes);
    SFA.Router.register('outlet',    Pages.outlet);
    SFA.Router.register('order',     Pages.order);
    SFA.Router.register('orders',    Pages.orders);
    SFA.Router.register('profile',   Pages.profile);
    SFA.Router.register('404', () => {
      SFA.UI.render(`<div class="flex flex-col items-center justify-center min-h-screen text-gray-400">
        <span class="material-symbols-outlined text-6xl mb-3">error</span>
        <p class="font-bold">Halaman tidak ditemukan</p>
        <button onclick="SFA.Router.go('dashboard')" class="mt-4 text-[#bb000f] font-semibold text-sm">Kembali ke Dashboard</button>
      </div>`);
    });

    // Boot
    SFA.Router.init();
  </script>
</body>
</html>
